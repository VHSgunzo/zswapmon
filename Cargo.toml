cargo-features = ["panic-immediate-abort"]

[package]
name = "zswapmon"
version = "0.1.0"
edition = "2021"
description = "Utility for monitoring zswap status and statistics"
authors = ["VHSgunzo <vhsgunzo@gmail.com>"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
debug  = false
codegen-units = 1
panic = "immediate-abort"

[profile.dev]
opt-level = 0
